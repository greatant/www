<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NuThub — Embedded ArcGIS Hub</title>
  <style>
    :root {
      --max-width: 1600px;
      --bg: #f7f8fa;
      --card-bg: #fff;
      --muted: #6b7280;
    }

    /* Basic page layout */
    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: var(--bg);
      color: #111827;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    .wrap {
      box-sizing: border-box;
      padding: 20px;
      min-height: 100%;
      display: flex;
      align-items: start;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.125rem;
      margin: 0;
      line-height: 1.2;
    }

    .meta {
      color: var(--muted);
      font-size: 0.92rem;
    }

    /* Responsive embed container:
       - Default: 16:9 for common widescreen devices
       - On very wide screens: use 21:9 for an ultra-widescreen layout
       - Max height constrained so the embed doesn't overflow the viewport
    */
    .embed-wrap {
      width: 100%;
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(15,23,42,0.06);
      aspect-ratio: 16 / 9;
      max-height: 80vh;
      position: relative;
    }

    @media (min-width: 1400px) {
      /* Use a wider aspect ratio for very wide displays */
      .embed-wrap {
        aspect-ratio: 21 / 9;
      }
    }

    .embed-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    .note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    a {
      color: #0366d6;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="container">
      <header>
        <div>
          <h1>NuThub — Interactive View</h1>
          <div class="meta">Embedded ArcGIS Hub (responsive for widescreen)</div>
        </div>
      </header>

      <div class="embed-wrap" role="region" aria-label="ArcGIS Hub embed">
        <!-- <iframe
          src="https://amsmem32-aarsc.hub.arcgis.com"
          title="NuThub ArcGIS Hub"
          loading="lazy"
          allowfullscreen
          sandbox="allow-same-origin allow-scripts allow-forms allow-popups"
        ></iframe> -->
        <iframe
  src="https://amsmem32-aarsc.hub.arcgis.com"
  sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation"
  referrerpolicy="no-referrer-when-downgrade"
  style="width:100%; height:100vh; border:0;">
</iframe>
      </div>

      <p class="note">
        If the content does not appear the remote site may disallow embedding. You can open it directly:
        <a href="https://amsmem32-aarsc.hub.arcgis.com" target="_blank" rel="noopener noreferrer">Open ArcGIS Hub</a>.
      </p>
    </div>
  </div>
</body>
</html>
